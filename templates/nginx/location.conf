# __APP__ instance: __NAME__ (path mount, prefix kept)
# This file must be included *inside* a server { } block.
location = /__BASE_PATH__ {
    proxy_cache off;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    add_header Cache-Control "private, max-age=0, must-revalidate" always;
    return 302 /__BASE_PATH__/;
}

__NGINX_EXTRA__
location /__BASE_PATH__/ {
    proxy_cache off;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    add_header Cache-Control "private, max-age=0, must-revalidate" always;
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
}
