# __APP__ instance: __NAME__
# Dedicated hostname. Certificate comes from the http context (conf.d)
# or from lines certbot adds on this server. nginx -t fails until one exists.
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __SERVER_NAME__;

    # Revalidate every proxied path, including /. Nginx does not store these
    # and does not invent an ETag; it forwards one when the app sends it.
    proxy_cache off;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    add_header Cache-Control "private, max-age=0, must-revalidate" always;

__NGINX_EXTRA__
    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
