# __APP__ instance: __NAME__
# Dedicated hostname. Certificate comes from the http context (conf.d)
# or from lines certbot adds on this server. nginx -t fails until one exists.
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __SERVER_NAME__;

__NGINX_EXTRA__
    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
