# Static path /__BASE_PATH__/ served from __ROOT__
# This file must be included *inside* a server { } block (the TLS server).
location = /__BASE_PATH__ {
    return 301 /__BASE_PATH__/;
}

location ^~ /__BASE_PATH__/ {
    # Revalidate every file, including a 404. The browser may keep a copy,
    # but must check before reuse. Nginx answers 304 when the file is unchanged.
    add_header Cache-Control "no-cache" always;
    alias __ROOT__/;
    index index.html;
}
