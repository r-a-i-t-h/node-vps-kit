# Static site: __SERVER_NAME__
# Certificate comes from the http context (conf.d)
# or from lines certbot adds on this server. nginx -t fails until one exists.
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;
    include /etc/nginx/snippets/nvk-https-redirect.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __SERVER_NAME__;

    root __ROOT__;
    index index.html;

    location / {
        # Revalidate every file, including a 404. The browser may keep a copy,
        # but must check before reuse. Nginx answers 304 when the file is unchanged.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
